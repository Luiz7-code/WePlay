<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fliperama — Menu de jogos</title>
<style>
:root { --accent: #a9ff47; --bg:#090c17; --panel:#080e18; --ink:#f8ffed; }
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#03050a;color:var(--ink);overflow:hidden;font-family:"Courier New",monospace;}
body{display:grid;place-items:center;}
#machine{width:min(100vw,177.7778vh);height:min(56.25vw,100vh);position:relative;isolation:isolate;overflow:hidden;background:#06121c;border:0.35vmin solid #10172c;box-shadow:0 0 0 0.3vmin #29294c,0 0 0 0.7vmin #05050b,0 0 60px #100c27}
#world{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;}
#machine:after{content:"";position:absolute;pointer-events:none;inset:0;background:repeating-linear-gradient(to bottom,rgba(2,2,5,0) 0px,rgba(2,2,5,0) 3px,rgba(0,0,0,.21) 4px);mix-blend-mode:multiply;opacity:.6;z-index:10}
#machine:before{content:"";position:absolute;pointer-events:none;inset:0;background:radial-gradient(ellipse at 50% 48%,transparent 35%,rgba(0,0,0,.51) 100%);z-index:9}
.top-bar,.bottom-bar,.side-panel,.nav,.modal,.sound,.full{position:absolute;z-index:12}
.top-bar{top:3.5%;left:3.5%;display:flex;gap:1.2vw;align-items:flex-start}
.tiny{font-size:clamp(7px,0.95vw,15px);letter-spacing:.16em;color:#ebf9d2;text-shadow:2px 2px 0 #000;text-transform:uppercase;font-weight:900;}
.top-bar .blink{width:.7vw;min-width:7px;aspect-ratio:1;background:#b8ff4a;box-shadow:0 0 15px #adff4c;animation:blink 1.5s steps(2) infinite}
@keyframes blink{50%{opacity:.3}}
#game-title{font-size:clamp(23px,3.5vw,56px);line-height:1.04;font-weight:1000;letter-spacing:-.05em;margin-top:1.05vw;text-transform:uppercase;text-shadow:4px 4px 0 #11172b,7px 7px 0 #050b10;max-width:37vw;}
#game-sub{font-size:clamp(8px,1.15vw,18px);font-weight:bold;letter-spacing:.11em;color:#d6fff5;margin-top:1vw;text-shadow:2px 2px 0 #070717}
.side-panel{right:4.1%;top:15%;width:26%;height:66%;padding:1.25% 1.55%;background:linear-gradient(160deg,rgba(4,9,16,.95),rgba(7,18,22,.84));border:4px solid #1e2e36;outline:2px solid #0b1118;box-shadow:inset 0 0 0 3px #486061,7px 7px 0 rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;gap:1.1%;}
.box-head{font-size:clamp(8px,1vw,17px);font-weight:1000;color:var(--accent);text-transform:uppercase;letter-spacing:.12em;display:flex;justify-content:space-between}
.art-shell{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#0c1119;outline:3px solid #080b10;border:2px solid #29373a;overflow:hidden;position:relative;}
.art-shell:before{position:absolute;content:"";inset:0;box-shadow:inset 0 0 30px #000;z-index:1;pointer-events:none}
#logo{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;transition:opacity .18s;}
#count{font-size:clamp(9px,1.3vw,19px);color:#fff;letter-spacing:.2em;text-align:center;font-weight:1000}
#count b{color:var(--accent)}
.meter{height:7px;display:flex;gap:5px}
.meter i{height:100%;flex:1;display:block;background:#233637;border:1px solid #07100e}
.meter i.active{background:var(--accent);box-shadow:0 0 11px var(--accent)}
.nav{left:36%;bottom:14%;display:flex;gap:10px;align-items:center;transform:translateX(-50%)}
.kbtn,.start,.sound,.full{background:#111824;color:#fff;font:900 clamp(10px,1.3vw,19px)/1 "Courier New",monospace;letter-spacing:.05em;cursor:pointer;border:3px solid #11121b;box-shadow:inset 0 0 0 2px #668380,4px 4px 0 #05060b;text-shadow:1px 1px #000;touch-action:manipulation;}
.kbtn{width:4.8vw;min-width:37px;aspect-ratio:1;}
.start{padding:1.1vw 2vw;background:var(--accent);color:#071016;text-shadow:none;box-shadow:inset 0 0 0 2px #fff,4px 4px 0 #070b12;}
button:active{transform:translate(3px,3px);box-shadow:none;}
.bottom-bar{bottom:3.5%;left:3.5%;right:3.5%;display:flex;justify-content:space-between;align-items:end;gap:2%;color:#dbf9eb;font-size:clamp(7px,.95vw,15px);font-weight:900;text-shadow:2px 2px 0 black;letter-spacing:.05em;}
.bottom-bar b{color:var(--accent)}
.bottom-bar .hint{text-align:right}
.sound{right:4.1%;top:4.2%;padding:.7vw 1vw;font-size:clamp(8px,.9vw,13px);}
.full{right:13%;top:4.2%;padding:.7vw 1vw;font-size:clamp(8px,.9vw,13px);}
#toast{position:absolute;left:50%;top:75%;z-index:12;transform:translateX(-50%);font-size:clamp(8px,1vw,16px);font-weight:900;letter-spacing:.12em;color:#efffed;text-shadow:2px 2px 0 #000;background:rgba(0,0,0,.55);padding:7px 12px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.modal{inset:0;display:none;place-items:center;background:rgba(2,4,13,.82);backdrop-filter:blur(4px);padding:6vw}
.modal.open{display:grid}
.modalbox{background:#121a26;border:4px solid var(--accent);box-shadow:0 0 0 5px #050b15,12px 12px 0 #02040a;max-width:760px;width:85%;padding:3vw;text-align:center}
.modalbox h2{font-size:clamp(16px,3vw,38px);margin:.4em 0;text-transform:uppercase;color:var(--accent);text-shadow:3px 3px #000}
.modalbox p{font-size:clamp(11px,1.4vw,20px);line-height:1.5;font-weight:800;color:#eef1f9}
.modalbox code{color:var(--accent);word-break:break-word;font-size:.85em}
.modalbox .start{margin-top:1vw}
@media (max-width: 640px){
 .side-panel{border-width:2px;outline-width:1px;box-shadow:inset 0 0 0 1px #486061,3px 3px #000;padding:1.5%}
 .art-shell{border-width:1px;outline-width:1px}
 .top-bar{top:4%;left:3%}.kbtn,.start,.sound,.full{border-width:1px;box-shadow:inset 0 0 0 1px #668380,2px 2px #05060b}
 .nav{bottom:12%;gap:4px} .bottom-bar{bottom:2%}
}
/* ===== CENÁRIO (crossfade) ===== */
#bg{position:absolute;inset:0;z-index:0;background:#06121c}
.bgl{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;opacity:0;transition:opacity .75s ease;image-rendering:pixelated;filter:saturate(1.05) brightness(.92)}
.bgl.on{opacity:1}
/* scrim: garante contraste do título (canto sup. esquerdo) e dos controles sem esconder a arte */
#bgScrim{position:absolute;inset:0;z-index:50;pointer-events:none;background:linear-gradient(115deg,rgba(3,6,14,.78) 0,rgba(3,6,14,.38) 36%,rgba(3,6,14,0) 62%),linear-gradient(0deg,rgba(3,6,14,.6),transparent 28%)}
#world{z-index:1}
#logo{image-rendering:auto;filter:drop-shadow(0 0 10px var(--accent));transition:opacity .18s}
/* ===== TÍTULO ANIMADO ===== */
#game-title{display:flex;flex-wrap:wrap;position:relative;-webkit-text-stroke:.14vw rgba(0,0,0,.85);paint-order:stroke fill}
#game-title .w{display:inline-flex;margin-right:.3em;white-space:nowrap}
#game-title .ch{position:relative;display:inline-block;animation:chIn .55s cubic-bezier(.2,1.5,.4,1) backwards;animation-delay:calc(var(--i)*45ms)}
@keyframes chIn{from{opacity:0;transform:translateY(-.6em) scale(.6)}}
/* TECH: glitch RGB */
.th-tech .ch{color:#eaffd0}
.th-tech .ch:before,.th-tech .ch:after{content:attr(data-c);position:absolute;inset:0;-webkit-text-stroke:0;text-shadow:none;mix-blend-mode:screen;clip-path:inset(0 0 100% 0)}
.th-tech .ch:before{color:#ff2bd6;animation:gl1 2.6s steps(1) infinite;animation-delay:calc(var(--i)*-.31s)}
.th-tech .ch:after{color:#19f0ff;animation:gl2 2.6s steps(1) infinite;animation-delay:calc(var(--i)*-.17s)}
@keyframes gl1{0%,84%,100%{clip-path:inset(0 0 100% 0)}86%{transform:translate(-.3vw,0);clip-path:inset(8% 0 55% 0)}92%{transform:translate(.25vw,0);clip-path:inset(60% 0 8% 0)}}
@keyframes gl2{0%,88%,100%{clip-path:inset(0 0 100% 0)}90%{transform:translate(.3vw,0);clip-path:inset(35% 0 35% 0)}95%{transform:translate(-.2vw,0);clip-path:inset(75% 0 0 0)}}
.th-tech{animation:flick 3.4s steps(1) infinite}@keyframes flick{0%,93%,100%{opacity:1}94%{opacity:.55}96%{opacity:1}97%{opacity:.7}}
/* PIZZA: queijo derretendo */
.th-pizza .ch{color:transparent;background:linear-gradient(#fff3ae,#ffc83a 55%,#f08a1c);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:0;text-shadow:none;filter:drop-shadow(.18vw .24vw 0 #5a1d0b) drop-shadow(0 0 .3vw rgba(0,0,0,.65));transform-origin:50% 20%;animation:chIn .55s cubic-bezier(.2,1.5,.4,1) backwards,melt 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*45ms),calc(var(--i)*45ms + .6s)}
@keyframes melt{50%{transform:scaleY(1.07)}}
.drip{position:absolute;left:22%;top:80%;width:24%;height:.45em;background:linear-gradient(#ffd44a,#f5a623);border-radius:0 0 99px 99px;transform-origin:top;transform:scaleY(.15);animation:drip 3.4s ease-in-out infinite;animation-delay:calc(var(--i)*-.55s)}
.drip:after{content:"";position:absolute;left:-10%;bottom:-.12em;width:120%;aspect-ratio:1;border-radius:50%;background:#f5a623}
@keyframes drip{0%{transform:scaleY(.15);opacity:1}55%{transform:scaleY(1.6);opacity:1}80%{transform:scaleY(1.9) translateY(.25em);opacity:0}100%{transform:scaleY(.15);opacity:0}}
/* GATO: flutuar + brilho mágico */
.th-cat .ch{color:transparent;background:linear-gradient(#f1d6ff,#b67bff 60%,#7c3fe0);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:0;text-shadow:none;filter:drop-shadow(.16vw .22vw 0 #1b0a3a) drop-shadow(0 0 .5vw #a35cff);animation:chIn .55s cubic-bezier(.2,1.5,.4,1) backwards,bob 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*45ms),calc(var(--i)*120ms + .6s)}
@keyframes bob{50%{transform:translateY(-.3em)}}
.th-cat:after{content:"✦ ✧";position:absolute;right:-.3em;top:-.8vw;font-size:1.4vw;color:#f1d6ff;-webkit-text-stroke:0;animation:tw 1.5s ease-in-out infinite}
@keyframes tw{50%{opacity:.2;transform:scale(.7) rotate(40deg)}}
/* LILÁS: halo suave */
.th-lilac .ch{color:transparent;background:linear-gradient(#fff,#f2ccff 55%,#e29cff);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:0;text-shadow:none;filter:drop-shadow(.16vw .2vw 0 #442b69) drop-shadow(0 0 .45vw #f6d9ff);animation:chIn .55s cubic-bezier(.2,1.5,.4,1) backwards,sway 3.6s ease-in-out infinite;animation-delay:calc(var(--i)*45ms),calc(var(--i)*150ms + .6s)}
@keyframes sway{50%{transform:translateY(-.12em) rotate(-2deg)}}
.th-lilac:before{content:"";position:absolute;left:.1em;top:-.9vw;width:46%;height:.9vw;border:.3vw solid #e5b6ff;border-radius:50%;filter:drop-shadow(0 0 .5vw #f6d9ff);animation:halo 3s ease-in-out infinite}
@keyframes halo{50%{transform:translateY(-.4vw)}}
@media (prefers-reduced-motion:reduce){#game-title,#game-title *,.drip{animation:none!important}}
#bg{display:none}#game-title{visibility:hidden;height:14vw}#logo{image-rendering:pixelated;filter:none}

function imageFit(img,x,y,w,h,back){
 if(back)rect(x,y,w,h,back);
 if(!img.complete||!img.naturalWidth)return;
 let ratio=Math.min(w/img.width,h/img.height),ww=img.width*ratio,hh=img.height*ratio;
 ctx.drawImage(img,Math.round(x+(w-ww)/2),Math.round(y+(h-hh)/2),Math.round(ww),Math.round(hh));
}
